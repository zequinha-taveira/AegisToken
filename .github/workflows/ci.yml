name: ci

on:
  push:
    branches: [development, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: host (aegis-core, aegis-applets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install target and components
        run: |
          rustup target add thumbv8m.main-none-eabihf
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (core)
        run: cargo clippy -p aegis-core --all-targets -- -D warnings
      - name: Test (core)
        run: cargo test -p aegis-core
      - name: Clippy (applets)
        run: cargo clippy -p aegis-applets --all-targets -- -D warnings
      - name: Test (applets)
        run: cargo test -p aegis-applets
      - name: Clippy (build support)
        run: cargo clippy -p aegis-build-support --all-targets -- -D warnings
      - name: Test (build support)
        run: cargo test -p aegis-build-support

  release-gate:
    name: release gate (vendor key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install target and components
        run: |
          rustup target add thumbv8m.main-none-eabihf
          rustup component add rustfmt clippy
      - name: Gate refuses a missing vendor key
        env:
          AEGIS_RELEASE: "1"
        run: |
          set +e
          output="$(cargo check -p firmware-universal-rp2350 --target thumbv8m.main-none-eabihf 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::The release gate must fail without AEGIS_UPDATE_VENDOR_PUBKEY."
            exit 1
          fi
          echo "$output" | grep -q "AEGIS_RELEASE=1 requires a production firmware-update vendor key" || {
            echo "::error::The release gate must fail with the gate message."
            exit 1
          }
      - name: Gate accepts a production key
        env:
          AEGIS_RELEASE: "1"
          # Format-valid but not a curve point: disposable public material,
          # used only to check that the gate lets a non-development key pass.
          AEGIS_UPDATE_VENDOR_PUBKEY: "04a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1"
        run: cargo check -p firmware-universal-rp2350 --target thumbv8m.main-none-eabihf

  host-tool:
    name: host tool (aegistoken-host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install components
        run: rustup component add clippy
      - name: Clippy
        run: cargo clippy -p aegistoken-host --all-targets -- -D warnings
      - name: Test
        run: cargo test -p aegistoken-host

  firmware:
    name: firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [rp2350a, rp2350b, rp2354a, rp2354b]
    steps:
      - uses: actions/checkout@v7
      - name: Install target and components
        run: |
          rustup target add thumbv8m.main-none-eabihf
          rustup component add clippy
      - name: Clippy board and firmware
        run: >-
          cargo clippy -p firmware-universal-rp2350
          --no-default-features --features ${{ matrix.board }}
          --target thumbv8m.main-none-eabihf --release -- -D warnings
      - name: Build firmware
        run: >-
          cargo build -p firmware-universal-rp2350
          --no-default-features --features ${{ matrix.board }}
          --target thumbv8m.main-none-eabihf --release

  firmware-profiles:
    name: firmware profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [generic, waveshare-rp2350-zero, pimoroni-tiny-2350]
    env:
      AEGIS_BOARD: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
      - name: Install target and components
        run: |
          rustup target add thumbv8m.main-none-eabihf
          rustup component add clippy
      - name: Clippy board and firmware
        run: >-
          cargo clippy -p board-generic-rp2350 -p firmware-universal-rp2350
          --target thumbv8m.main-none-eabihf --release -- -D warnings
      - name: Build firmware
        run: >-
          cargo build -p firmware-universal-rp2350
          --target thumbv8m.main-none-eabihf --release
