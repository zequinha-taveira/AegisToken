name: Orca-Code-Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    steps:
      - name: Orca-Code-Review
        uses: Continuum-AI-Corp/Orca-Code-Review@v1.4.0
        with:
          orcarouter-api-key: ${{ secrets.ORCAROUTER_API_KEY }}
