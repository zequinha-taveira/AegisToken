name: release

# Build the universal firmware image with scripts/build-uf2.ps1 and publish the
# single UF2 artifact as a GitHub release. Triggered by pushing a `v*` tag; tags containing a hyphen
# (e.g. v0.2.0-rc1) are published as pre-releases. To embed the release update
# key, set the repository secret AEGIS_UPDATE_VENDOR_PUBKEY (65-byte SEC1 P-256
# hex, from scripts/gen-update-key.py); otherwise a development key is embedded.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag points to main
        run: |
          git fetch --no-tags origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Release tags must point to the current main commit."
            exit 1
          fi

      - name: Install Rust target
        run: rustup target add thumbv8m.main-none-eabihf

      - name: Build picotool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libusb-1.0-0-dev
          git clone --branch 2.3.0 --depth 1 \
            https://github.com/raspberrypi/picotool.git "$RUNNER_TEMP/picotool"
          git clone --branch 2.3.0 --depth 1 \
            --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          cmake -S "$RUNNER_TEMP/picotool" -B "$RUNNER_TEMP/picotool/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk"
          cmake --build "$RUNNER_TEMP/picotool/build" --parallel "$(nproc)"
          sudo cmake --install "$RUNNER_TEMP/picotool/build"
          picotool version

      - name: Build UF2 artifact
        env:
          AEGIS_UPDATE_VENDOR_PUBKEY: ${{ secrets.AEGIS_UPDATE_VENDOR_PUBKEY }}
        run: |
          pwsh -NoProfile -File scripts/build-uf2.ps1 -Board universal

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "AegisToken ${GITHUB_REF_NAME}" --generate-notes)
          case "${GITHUB_REF_NAME}" in *-*) args+=(--prerelease);; esac
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" AegisToken-*.uf2
